<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>absolute</title>
  <style>
    .card {
      width: 280px;
      height: 140px;
      margin: 60px 0 0 60px; /*상우하좌*/
      padding: 16px;
      background-color: #fef3c7;
      border: 2px solid #d97706;
      position: relative;
    }

    .badge{
      position: absolute;
      background-color: red;
      color: white;
      top: 10;
      bottom: 0;
      left:0;
    }

  </style>
</head>
<body>
  <div class="card">
    카드
    <span class="badge">NEW</span>
  </div>
</body>
</html>
