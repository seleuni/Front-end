<body>
  <script>
    console.log("시작-----------")
    let age
    if(age<8){
      console.log("입장료:0원")
    } else if(8>=age>=19){
      console.log("입장료:7,000원")
    } else if(20>=age>=64){
      console.log("입장료:10,000원")
    } else if(age>=65){
      console.log("입장료: 5,000원")
    } else {
      console.log("올바른 나이를 입력해주세요.")
    }
    console.log("끝-----------")
  </script>
  
</body>
