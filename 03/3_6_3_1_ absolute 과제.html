<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    body {
      padding: 40px;
      font-family: sans-serif;
      background: #f3f4f6;
    }
    /* 카드 기본 스타일 */
.card {
  width: 300px;
  height: 160px;
  background: #ffffff;
  border: 2px solid #cbd5e1;
  border-radius: 12px;
  padding: 20px;
  margin-bottom: 20px;
  box-shadow: 0 4px 6px rgba(0,0,0,0.05);
  position: relative;
}

/* 배지 기본 스타일 */
.badge {
  background: #ef4444;
  color: white;
  font-size: 12px;
  font-weight: bold;
  padding: 4px 8px;
  border-radius: 4px;
  position: absolute;
  top: 0;
  right: 0;

}


  </style>


</head>
<body>
  <div class="card"
  <h3>웹 개발 기초 과정</h3>
  <p>position 속성을 정복해 봅시다.</p>
  <span class="badge">NEW</span>
  </div>
</body>
</html>
